server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Folder of Telegram exports (mounted read-only); its JSON listing is the start page's chat list
    location /chats/ {
        alias /chats/;
        autoindex on;
        autoindex_format json;
    }

    # Single Telegram export (mounted read-only) — alternative to /chats/; open /?chat=/chat/
    location /chat/ {
        alias /chat/;
        autoindex on;
        autoindex_format json;
    }
}
