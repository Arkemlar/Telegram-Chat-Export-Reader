server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Telegram export folder (mounted read-only); JSON listing is used by the app's ?chat= loader
    location /chat/ {
        alias /chat/;
        autoindex on;
        autoindex_format json;
    }
}
